<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE TEST</title>
</head>
<body>
    <table border="3" cellspacing="5" cellpadding="10" width="100%">
        <caption align="center"><strong>Quarterly Sales Report (INR)</strong></caption>
        <tr bgcolor="darkgray" align ="center">
            <th>Category</th>
            <th>Product</th>
            <th>Q1 Sales</th>
            <th>Q2 Sales</th>
        </tr>
        <tr>
            <td rowspan="2"  valign="top">Electronics</td>
            <td align="left">Smartphones</td>
            <td align="right">₹4,72,450</td>
            <td align="right">₹5,85,838</td>
        </tr>
        <tr>
            <td align="left">Laptops</td>
            <td align="right">₹8,03,165</td>
            <td align="right">₹8,59,859</td>
        </tr>
        <tr bgcolor="lightgray">
            <td colspan="2" align="left"><strong>Total Gross</strong></td>
            <td align="right"><strong>₹12,75,615</strong></td>
            <td align="right"><strong>₹14,45,697</strong></td>
        </tr>
    </table>
</body>
</html>
